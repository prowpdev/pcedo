<!-- Controls: Global search, actions -->
<div class="flex gap-2 items-center mb-2">
    <input type="text" id="global-search" placeholder="Search..." class="px-3 py-2 border rounded w-72">
    <button id="add-row-btn" class="btn bg-blue-600 text-white px-3 py-2 rounded">Add Row</button>
    <button id="add-col-btn" class="btn bg-green-600 text-white px-3 py-2 rounded">Add Column</button>
    <button id="export-csv-btn" class="btn bg-gray-600 text-white px-3 py-2 rounded">Export CSV</button>
    <button id="export-xlsx-btn" class="btn bg-gray-600 text-white px-3 py-2 rounded">Export Excel</button>
    <button id="save-btn" class="btn bg-purple-600 text-white px-3 py-2 rounded ml-auto">Save Spreadsheet</button>
    <button id="populate-row-btn" class="btn bg-blue-600 text-white px-3 py-2 rounded">Populate row from parent</button>
</div>
<div class="reports">
    <div class="flex gap-2 items-center mb-2">
        <button id="generate-monthly-reports" class="btn bg-green-600 text-white px-3 py-2 rounded">Generate Monthly Reports</button>
    </div>
</div>
