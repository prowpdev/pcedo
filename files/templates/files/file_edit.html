{% extends 'files/base.html' %}

{% block content %}
<h2>{% if file %}Edit{% else %}Create{% endif %} Spreadsheet</h2>

<form method="post">
    {% csrf_token %}
    {{ form.as_p }}
</form>

<div id="tabulator-table"></div>

<button id="save-btn" style="margin-top:10px;">Save Spreadsheet</button>

<!-- Safe JSON from Django -->
<div id="data-json" style="display:none;">{{ data_json|safe }}</div>

<!-- Tabulator CSS & JS -->
<link href="https://unpkg.com/tabulator-tables@5.5.1/dist/css/tabulator.min.css" rel="stylesheet">
<script src="https://unpkg.com/tabulator-tables@5.5.1/dist/js/tabulator.min.js"></script>

<script>
document.addEventListener('DOMContentLoaded', function () {
    let initialData = JSON.parse(document.getElementById('data-json').textContent);

    // Ensure initialData has columns and rows
    initialData.columns = initialData.columns || [];
    initialData.rows = initialData.rows || [];

    // Build Tabulator columns dynamically
    let columns = initialData.columns.map(colName => ({
        title: colName,
        field: colName,
        editor: "input",
        headerSort: false,
        titleFormatter: function(cell, formatterParams, onRendered){
            const colDiv = document.createElement("div");
            colDiv.style.display = "flex";
            colDiv.style.alignItems = "center";
            colDiv.style.justifyContent = "space-between";

            const titleSpan = document.createElement("span");
            titleSpan.textContent = colName;

            const delBtn = document.createElement("button");
            delBtn.textContent = "×";
            delBtn.style.marginLeft = "5px";
            delBtn.style.cursor = "pointer";
            delBtn.addEventListener("click", () => {
                if (confirm(`Delete column "${colName}"?`)) {
                    table.deleteColumn(colName);
                    const index = initialData.columns.indexOf(colName);
                    if (index > -1) initialData.columns.splice(index, 1);
                }
            });

            colDiv.appendChild(titleSpan);
            colDiv.appendChild(delBtn);
            return colDiv;
        }
    }));

    // Add delete button as first column
    columns.unshift({
        title: "Delete",
        formatter: "buttonCross",
        width: 70,
        align: "center",
        cellClick: (e, cell) => cell.getRow().delete()
    });

    // Initialize Tabulator
    const table = new Tabulator("#tabulator-table", {
        data: initialData.rows,
        columns: columns,
        layout: window.innerWidth <= 768 ? "fitDataStretch" : "fitColumns",
        reactiveData: true,
    });

    // Adjust layout on window resize
    window.addEventListener('resize', () => {
        const newLayout = window.innerWidth <= 768 ? "fitDataStretch" : "fitColumns";
        table.setOptions({ layout: newLayout });
    });

    // Add Row button
    const addRowBtn = document.createElement('button');
    addRowBtn.textContent = "Add Row";
    addRowBtn.style.marginTop = "10px";
    addRowBtn.addEventListener('click', () => {
        let numRows = parseInt(prompt("How many rows to add?", "1"));
        if (!isNaN(numRows) && numRows > 0) {
            // Determine next ID based on existing rows
            let maxId = table.getData().reduce((max, row) => row.id > max ? row.id : max, 0);
            for (let i=0; i<numRows; i++) {
                let newRow = { id: maxId + i + 1 };
                // Initialize all columns with empty string
                initialData.columns.forEach(col => {
                    if (!(col in newRow)) newRow[col] = "";
                });
                table.addRow(newRow);
            }
        } else {
            alert("Please enter a valid number!");
        }
    });
    document.getElementById('tabulator-table').after(addRowBtn);

    // Add Column button
    const addColBtn = document.createElement('button');
    addColBtn.textContent = "Add Column";
    addColBtn.style.marginTop = "10px";
    addColBtn.style.marginLeft = "10px";
    addColBtn.addEventListener('click', () => {
        const colName = prompt("Enter column name:");
        if (colName) {
            table.addColumn({
                title: colName,
                field: colName,
                editor: "input",
                headerSort: false,
                titleFormatter: function(cell){
                    const colDiv = document.createElement("div");
                    colDiv.style.display = "flex";
                    colDiv.style.alignItems = "center";
                    colDiv.style.justifyContent = "space-between";
                    const titleSpan = document.createElement("span");
                    titleSpan.textContent = colName;
                    const delBtn = document.createElement("button");
                    delBtn.textContent = "×";
                    delBtn.style.marginLeft = "5px";
                    delBtn.style.cursor = "pointer";
                    delBtn.addEventListener("click", () => {
                        if (confirm(`Delete column "${colName}"?`)) {
                            table.deleteColumn(colName);
                            const index = initialData.columns.indexOf(colName);
                            if (index > -1) initialData.columns.splice(index, 1);
                        }
                    });
                    colDiv.appendChild(titleSpan);
                    colDiv.appendChild(delBtn);
                    return colDiv;
                }
            });
            initialData.columns.push(colName);

            // Initialize new column cells for existing rows
            table.getData().forEach(row => {
                row[colName] = "";
            });
            table.replaceData(table.getData());
        }
    });
    addRowBtn.after(addColBtn);

    // Save Spreadsheet button
    document.getElementById('save-btn').addEventListener('click', () => {
        const rows = table.getData();
        const dataToSave = {
            columns: initialData.columns,
            rows: rows
        };
        fetch("{% url 'save_file_data' file.pk %}", {
            method: "POST",
            headers: {
                "X-CSRFToken": "{{ csrf_token }}",
                "Content-Type": "application/x-www-form-urlencoded"
            },
            body: "tableData=" + encodeURIComponent(JSON.stringify(dataToSave))
        }).then(res => res.json()).then(data => alert("Saved!"));
    });
});
</script>
{% endblock %}
