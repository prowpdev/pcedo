{% extends 'files/base.html' %}

{% block content %}
<h2>{% if file %}Edit{% else %}Create{% endif %} Spreadsheet</h2>

<form method="post">
    {% csrf_token %}
    {{ form.as_p }}
</form>

<div id="tabulator-table"></div>

<button id="save-btn" style="margin-top:10px;">Save Spreadsheet</button>

<!-- Pass JSON data safely -->
<div id="data-json" style="display:none;">
    {{ data_json|safe }}
</div>

<!-- Tabulator CSS & JS -->
<link href="https://unpkg.com/tabulator-tables@5.5.1/dist/css/tabulator.min.css" rel="stylesheet">
<script src="https://unpkg.com/tabulator-tables@5.5.1/dist/js/tabulator.min.js"></script>

<script>
document.addEventListener('DOMContentLoaded', function () {
    // Parse initial data
    let initialData = {};
    try {
        initialData = JSON.parse(document.getElementById('data-json').textContent);
    } catch(e){
        initialData = {columns: [], rows: []};
    }

    initialData.columns = initialData.columns || [];
    initialData.rows = initialData.rows || [];

    const parentColumns = {{ parent_columns|safe }}; // parent column names
    const parentColumnValues = {{ parent_column_values|safe }}; // {column_name: [values]}

    // Build Tabulator columns
    let columns = [
        { title: "Delete", formatter: "buttonCross", width: 70, align: "center",
          cellClick: (e, cell) => cell.getRow().delete() }
    ];

    initialData.columns.forEach(colObj => {
        const colName = colObj.name;
        const mapping = colObj.mapping;

        let editor = "input";
        let editorParams = {};
        if(mapping !== "custom" && parentColumnValues[mapping]){
            editor = "select";
            editorParams = { values: parentColumnValues[mapping] };
        }

        columns.push({
            title: `${colName} (${mapping})`,
            field: colName,
            editor: editor,
            editorParams: editorParams,
            headerSort: false,
            titleFormatter: function(){
                const colDiv = document.createElement("div");
                colDiv.style.display="flex";
                colDiv.style.alignItems="center";
                colDiv.style.justifyContent="space-between";

                const titleSpan = document.createElement("span");
                titleSpan.textContent = `${colName} (${mapping})`;

                const delBtn = document.createElement("button");
                delBtn.textContent="×";
                delBtn.style.marginLeft="5px";
                delBtn.style.cursor="pointer";
                delBtn.addEventListener("click", ()=>{
                    if(confirm(`Delete column "${colName}"?`)){
                        table.deleteColumn(colName);
                        const idx = initialData.columns.findIndex(c => c.name === colName);
                        if(idx > -1) initialData.columns.splice(idx,1);
                    }
                });

                colDiv.appendChild(titleSpan);
                colDiv.appendChild(delBtn);
                return colDiv;
            }
        });
    });

    const table = new Tabulator("#tabulator-table", {
        data: initialData.rows,
        columns: columns,
        layout: window.innerWidth <= 768 ? "fitDataStretch" : "fitColumns",
        reactiveData: true
    });

    // Add Row button
    const addRowBtn = document.createElement('button');
    addRowBtn.textContent = "Add Row";
    addRowBtn.style.marginTop = "10px";
    addRowBtn.addEventListener('click', () => {
        let numRows = parseInt(prompt("How many rows to add?", "1"));
        if(!isNaN(numRows) && numRows>0){
            for(let i=0;i<numRows;i++){
                let newRow={};
                initialData.columns.forEach(col => {
                    newRow[col.name] = "";
                });
                table.addRow(newRow);
            }
        }
    });
    document.getElementById('tabulator-table').after(addRowBtn);

    // Add Column button
    const addColBtn = document.createElement('button');
    addColBtn.textContent = "Add Column";
    addColBtn.style.marginLeft = "10px";
    addColBtn.style.marginTop = "10px";

    addColBtn.addEventListener('click', () => {
        const colName = prompt("Enter column name:");
        if(!colName) return;

        let mapping = "custom";

        if(parentColumns.length > 0){
            const options = ["Custom"].concat(parentColumns);
            const choice = prompt(`Map this column to parent column?\nOptions:\n${options.join("\n")}`, "Custom");
            if(choice && choice !== "Custom" && parentColumns.includes(choice)){
                mapping = choice;
            }
        }

        initialData.columns.push({name: colName, mapping: mapping});

        let editor = "input";
        let editorParams = {};
        if(mapping !== "custom" && parentColumnValues[mapping]){
            editor = "select";
            editorParams = { values: parentColumnValues[mapping] };
        }

        table.addColumn({
            title: `${colName} (${mapping})`,
            field: colName,
            editor: editor,
            editorParams: editorParams,
            headerSort: false,
            titleFormatter: function(){
                const colDiv = document.createElement("div");
                colDiv.style.display="flex";
                colDiv.style.alignItems="center";
                colDiv.style.justifyContent="space-between";

                const titleSpan = document.createElement("span");
                titleSpan.textContent = `${colName} (${mapping})`;

                const delBtn = document.createElement("button");
                delBtn.textContent="×";
                delBtn.style.marginLeft="5px";
                delBtn.style.cursor="pointer";
                delBtn.addEventListener("click", ()=> {
                    if(confirm(`Delete column "${colName}"?`)){
                        table.deleteColumn(colName);
                        const idx = initialData.columns.findIndex(c => c.name === colName);
                        if(idx > -1) initialData.columns.splice(idx,1);
                    }
                });

                colDiv.appendChild(titleSpan);
                colDiv.appendChild(delBtn);
                return colDiv;
            }
        });

        table.getData().forEach(row=>row[colName]="");
        table.replaceData(table.getData());
    });

    addRowBtn.after(addColBtn);

    // Save button
    document.getElementById('save-btn').addEventListener('click', () => {
        const rows = table.getData();
        const dataToSave = {columns: initialData.columns, rows: rows};

        fetch("{% url 'save_file_data' file.pk %}", {
            method:"POST",
            headers:{
                "X-CSRFToken":"{{ csrf_token }}",
                "Content-Type":"application/x-www-form-urlencoded"
            },
            body:"tableData="+encodeURIComponent(JSON.stringify(dataToSave))
        }).then(res=>res.json()).then(data=>{
            if(data.status === 'success'){
                alert("Saved successfully!");
            } else {
                alert("Error saving data");
            }
        });
    });
});
</script>

{% endblock %}
